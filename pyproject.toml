[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rally"
version = "0.1.0"
description = "Trim a tennis match recording down to rally (live-play) segments only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
headless = ["opencv-python-headless>=4.8"]
players = ["opencv-python>=4.8", "ultralytics>=8.3.78", "lap>=0.5.12"]
pose = ["rtmlib>=0.0.15", "onnxruntime>=1.17"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=7.0", "httpx>=0.27"]
server = [
    "opencv-python-headless>=4.8",
    "ultralytics>=8.3.78",
    "lap>=0.5.12",
    "rtmlib>=0.0.15",
    "onnxruntime>=1.17",
    "torch>=2.0",
    "torchvision>=0.15",
    "gdown>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
desktop = [
    "opencv-python>=4.8",
    "ultralytics>=8.3.78",
    "lap>=0.5.12",
    "rtmlib>=0.0.15",
    "onnxruntime>=1.17",
    "torch>=2.0",
    "torchvision>=0.15",
    "gdown>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
[project.scripts]
rally = "rally.cli:main"
rally-web = "rally.web.app:main"
rally-evaluate = "rally.tools.evaluate:main"

[tool.setuptools.packages.find]
include = ["rally*"]

[tool.setuptools.package-data]
"rally" = ["trackers/*.yaml"]
"rally.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
